world_frame: world
odom_topic: /quad_0/lidar_slam/odom
map_topic: /map_generator/global_cloud
record_frequency: 10.0
min_point_spacing: 0.03
rdp_epsilon: 0.05
max_segment_length: 5.0
max_reasonable_speed: 2.25
# If an RDP candidate segment skips history whose z range exceeds this value,
# preserve the measured height change instead of creating a new diagonal.
vertical_preserve_threshold: 0.05
max_return_acceleration: 1.5
return_cruise_speed: 0.5
home_position_tolerance: 0.30
# Final ENU altitude above the recorded arm/Home point before landing takes over.
landing_handoff_height: 0.25
fixed_return_yaw: true
home_trim_radius: 0.30
return_finish_speed_threshold: 0.15
control_takeover_delay: 1.5
command_frequency: 100.0
turn_angle_threshold_deg: 20.0
turn_analysis_distance: 0.5
# V1.0.4 waypoint heading control.
#   tangent_interpolation : legacy (yaw sweeps across the whole segment)
#   waypoint_hold        : hold segment heading, turn near the waypoint
yaw_mode: waypoint_hold
yaw_transition_radius: 0.2
enable_return_command_output: false
require_control_takeover: false

# Manual Return Executor output.  This is consumed by CommandGate, NOT by the
# controller.  CommandGate is the sole publisher of /quad_0/planning/pos_cmd.
return_command_topic: /manual_return/return_pos_cmd
gate_set_manual_return_service: /manual_return/gate/set_manual_return
gate_set_normal_service: /manual_return/gate/set_normal

pcd_path: ""
offline_csv_test: false
output_dir: /home/tobeki/fanhang/logs/manual_return_output

# Safe-RDP V1.1 reservation only; V1.0.1 does not use these values for shortcut
# generation or collision decisions.
corridor_radius: 0.5
corridor_check_step: 0.2
min_length_ratio: 0.85
vehicle_body_radius: 0.39
localization_margin: 0.05
tracking_margin: 0.05
map_margin: 0.05
extra_safety_margin: 0.05
collision_check_step: 0.1

# =====================================================================
# Safe-RDP V1.1 (enabled).  Validates the compressed return path against
# the PCD map.  R_safe = uav_radius + tracking_margin + extra_margin.
# V1.1.0 only validates (no detour / replan / shortcut optimization).
# =====================================================================
safe_rdp:
  enabled: true
  uav_radius: 0.25
  tracking_margin: 0.15
  extra_margin: 0.10
  provenance_deviation_threshold: 0.06
  trust_flown_history: true
  safe_rdp_radius: 0.35
  history_fallback_spacing: 1.0
  voxel_resolution: 0.05
  collision_check_resolution: 0.05

# =====================================================================
# V2.0 Historical trajectory understanding (detection only, no deletion).
# =====================================================================
trajectory_analysis:
  segment_angle_threshold_deg: 30.0
  segment_speed_change_threshold: 0.5
  dwell_max_speed: 0.1
  dwell_radius: 0.15
  dwell_min_time: 2.0
  backtrack_epsilon_entry: 0.5
  backtrack_min_spur_ratio: 3.0
  backtrack_min_spur_reach: 0.5
  backtrack_apex_revisit_radius: 0.5
  # Calibrated from real flight (2026-08-24): outbound/return lateral offset
  # measured ~1.0 m, so 0.3 m missed every real overlap.
  overlap_distance_threshold: 1.2
  overlap_angle_threshold_deg: 30.0
  overlap_min_segment_length: 0.5
  overlap_min_fraction: 0.5
